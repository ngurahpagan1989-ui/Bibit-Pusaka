<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Bulat Bergradien Gelap Elegan -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Lingkaran Ornamen Emas Pusaka -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Batang / Tunas Tanaman -->
  <g filter="url(#glow)">
    <!-- Daun Kiri (Besar) -->
    <path d="M 256 310 C 210 260 140 250 110 300 C 100 350 170 380 256 320 Z" fill="url(#leafGrad)"/>
    <!-- Daun Kanan (Sedang) -->
    <path d="M 256 280 C 310 230 380 220 400 270 C 410 320 340 340 256 290 Z" fill="url(#leafGrad)"/>
    <!-- Pucuk Daun Atas (Tunas Pusaka) -->
    <path d="M 256 320 C 230 220 230 140 256 90 C 282 140 282 220 256 320 Z" fill="#6ee7b7"/>
    <!-- Batang Utama -->
    <path d="M 256 420 Q 256 340 256 300" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Butir Benih Emas di Akar -->
    <ellipse cx="256" cy="410" rx="34" ry="24" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
    <path d="M 256 392 Q 262 410 256 428" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Aksen Kilau Bintang Pusaka -->
    <polygon points="256,60 262,76 278,82 262,88 256,104 250,88 234,82 250,76" fill="url(#goldGrad)"/>
    <polygon points="380,160 384,170 394,174 384,178 380,188 376,178 366,174 376,170" fill="url(#goldGrad)" opacity="0.8"/>
    <polygon points="132,180 136,190 146,194 136,198 132,208 128,198 118,194 128,190" fill="url(#goldGrad)" opacity="0.8"/>
  </g>

  <!-- Tulisan Pusaka Bawah -->
  <text x="256" y="474" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ecfdf5" letter-spacing="6" text-anchor="middle">BIBIT PUSAKA</text>
</svg>
